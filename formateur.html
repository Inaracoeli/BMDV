<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BMDV — Formateur</title>
<link rel="stylesheet" href="css/formateur.css">
</head>
<body>

<!--
  Écran formateur, pensé pour un téléphone tenu à la verticale.
  Il ne contient pas le moteur : il affiche l'état reçu du TCO et lui
  envoie des actions (js/liaison.js). Trois onglets : Postes, Trains, Dérangements.
-->

<header>
  <div class="titre">BMDV <span>Formateur</span></div>
  <div id="liaison" class="hors-ligne">TCO non connecté</div>
</header>
<div id="seance">
  <div class="consigne">Code de séance à saisir sur le PC du TCO</div>
  <div class="code-grand" id="code-seance"></div>
  <div class="resume"><span>Séance <b id="code-court"></b></span><button id="nouvelle-seance" type="button">Nouvelle séance</button></div>
</div>
<div id="journal">En attente du TCO.</div>

<main>
  <section id="onglet-postes" class="actif">
    <label class="interrupteur"><input type="checkbox" id="auto"> <span>Alfa et Charlie automatiques</span></label>
    <div id="pupitres"></div>
  </section>

  <section id="onglet-trains">
    <div class="carte">
      <h2>Vitesse du simulateur</h2>
      <div id="acceleration" class="segmente"></div>
    </div>
    <div id="nouveau-train" class="carte">
      <h2>Nouveau train</h2>
      <div class="champs">
        <label>Numéro <input id="numero-train" type="text" inputmode="numeric" placeholder="auto" autocomplete="off"></label>
        <label>Longueur <select id="longueur-train"></select></label>
        <label>De <select id="origine-train"></select></label>
        <label>À <select id="destination-train"></select></label>
        <label>Vitesse maxi (km/h) <input id="vitesse-train" type="text" inputmode="numeric" autocomplete="off"></label>
      </div>
      <button type="button" id="lancer-train" class="principal">Lancer le train</button>
    </div>
    <div class="carte">
      <h2>Ligne</h2>
      <div class="schema-defilant" id="schema"></div>
    </div>
    <div id="trains"></div>
    <details class="carte">
      <summary>Distances de la ligne et réglages</summary>
      <div id="distances"></div>
    </details>
  </section>

  <section id="onglet-derangements">
    <div class="carte">
      <h2>Enclenchements</h2>
      <p class="aide">Décocher un enclenchement le lève : le block ne s'oppose plus à la manœuvre.</p>
      <div id="enclenchements"></div>
    </div>
    <div class="carte">
      <h2>Incidents</h2>
      <div id="incidents" class="boutons"></div>
    </div>
    <div class="carte">
      <h2>Séance</h2>
      <label class="interrupteur"><input type="checkbox" id="aide-reddition"> <span>Aide à l'élève : Sonnerie clignote si Reddition est pressée seule</span></label>
      <button id="reinitialiser" class="danger">Réinitialiser le simulateur</button>
    </div>
  </section>
</main>

<nav>
  <button data-onglet="postes" class="actif">Postes</button>
  <button data-onglet="trains">Trains <span id="nb-trains"></span></button>
  <button data-onglet="derangements">Dérangements</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/moteur.js"></script>
<script src="js/liaison.js"></script>
<script src="js/schema.js"></script>
<script src="js/formateur.js"></script>
</body>
</html>
