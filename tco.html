<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMDV — TCO Poste B</title>
<link rel="stylesheet" href="css/tco.css">
</head>
<body class="verrouille">

<!--
  TCO du poste B (Bravo).
  Chaque élément manipulable porte un id conforme à la nomenclature :
    préfixe  A_  block côté Alfa      C_  block côté Charlie
             T_  TCC                  E_  Point E
    type     B_  bouton   V_  voyant   C_  commutateur
  L'affichage est piloté par js/tco.js à partir de l'état du moteur (js/moteur.js),
  par l'attribut data-etat (blanc, jaune, rouge, bleu, vert).
  Commutateurs (TPL) : data-pos (ferme / ouvert, I / A) pour la manette,
  data-etat="rouge" pour l'allumage du dôme. Manette en bas = actif (fermé / I), allumé rouge ;
  manette en haut = inactif (ouvert / A), éteint.
  Les zones portent aussi data-zone : z1 et z2 ont chacune deux contrôles
  (T_V_Z1 + T_V_Z1B, T_V_Z2 + T_V_Z2B).
  Les voyants du point E (classe volet) sont électromécaniques, dans un boîtier en fonte : un volet rouge tombe
  ou remonte (data-etat="rouge"), sans halo. Les composants répétés (c-btn, c-lamp, c-zone, c-tpl...) sont définis
  une fois dans <defs> et colorés par les variables CSS --face / --glow / --lit.
-->

<svg class="tco" viewBox="0 0 2000 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtres -->
    <filter id="flou" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="ombre" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-opacity=".4"/>
    </filter>
    <filter id="ombre-panneau" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity=".28"/>
    </filter>

    <!-- Dégradés -->
    <linearGradient id="g-ivoire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f6e6"/><stop offset="1" stop-color="#eeead5"/>
    </linearGradient>
    <linearGradient id="g-console" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe9d6"/><stop offset="1" stop-color="#c5d8c0"/>
    </linearGradient>
    <linearGradient id="g-plaque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f4ea"/><stop offset="1" stop-color="#e3dfce"/>
    </linearGradient>
    <linearGradient id="g-metal-sombre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666b72"/><stop offset="1" stop-color="#25282c"/>
    </linearGradient>
    <linearGradient id="g-chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafbfb"/><stop offset=".35" stop-color="#9da3ab"/>
      <stop offset=".6" stop-color="#e6e8eb"/><stop offset="1" stop-color="#6c727a"/>
    </linearGradient>
    <linearGradient id="g-reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="g-voie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e88420"/><stop offset=".7" stop-color="#d9730d"/><stop offset="1" stop-color="#b65f09"/>
    </linearGradient>
    <linearGradient id="g-manette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d939b"/><stop offset=".3" stop-color="#fbfbf8"/>
      <stop offset=".7" stop-color="#e9e6d8"/><stop offset="1" stop-color="#7d838b"/>
    </linearGradient>
    <radialGradient id="g-dome" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#fffef6"/><stop offset=".6" stop-color="#e9e4cf"/><stop offset="1" stop-color="#b3ad95"/>
    </radialGradient>
    <radialGradient id="g-dome-rouge" cx=".45" cy=".4" r=".75">
      <stop offset="0" stop-color="#ffc0a6"/><stop offset=".45" stop-color="#ff3a2a"/><stop offset="1" stop-color="#a5120b"/>
    </radialGradient>

    <!-- Bouton poussoir lumineux (centré) -->
    <g id="c-btn">
      <rect x="-30" y="-30" width="60" height="60" rx="10" filter="url(#flou)" style="fill:var(--face);opacity:var(--glow,0)"/>
      <rect x="-27" y="-27" width="54" height="54" rx="6" fill="url(#g-metal-sombre)" stroke="#0e0f10"/>
      <rect x="-23" y="-23" width="46" height="46" rx="4" style="fill:var(--face,#14161a)"/>
      <rect x="-23" y="-23" width="46" height="46" rx="4" fill="url(#g-reflet)"/>
    </g>

    <!-- Voyant rond (centré) -->
    <g id="c-lamp">
      <circle r="13" filter="url(#flou)" style="fill:var(--face);opacity:var(--glow,0)"/>
      <circle r="8.5" fill="url(#g-metal-sombre)" stroke="#0e0f10" stroke-width=".8"/>
      <circle r="6" style="fill:var(--face,#2a2d31)"/>
      <ellipse cx="-1.8" cy="-2.2" rx="2.4" ry="1.6" fill="#fff" opacity=".35"/>
    </g>

    <!-- Contrôle de zone sur la voie (origine en haut à gauche, 68 x 22) -->
    <g id="c-zone">
      <rect x="-4" y="-4" width="76" height="30" rx="6" filter="url(#flou)" style="fill:var(--face);opacity:var(--glow,0)"/>
      <rect x="-2" y="-2" width="72" height="26" rx="4" fill="#191b1e"/>
      <rect width="68" height="22" rx="2.5" style="fill:var(--face,#3b3f44)"/>
      <rect width="68" height="22" rx="2.5" fill="url(#g-reflet)"/>
    </g>

    <!-- Voyants électromécaniques du point E : vitre terne et stries du voyant de carré -->
    <linearGradient id="g-vitre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".25" stop-color="#000" stop-opacity=".05"/>
      <stop offset="1" stop-color="#000" stop-opacity=".16"/>
    </linearGradient>
    <pattern id="p-stries" width="7" height="23" patternUnits="userSpaceOnUse">
      <rect width="7" height="23" fill="#d6d2c4"/><rect x="2" width="3" height="23" fill="#1d1f22"/>
    </pattern>
    <!-- Boîtier en fonte des voyants électromécaniques -->
    <linearGradient id="g-fonte" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3a8ad"/><stop offset=".5" stop-color="#858a90"/><stop offset="1" stop-color="#6a6f75"/>
    </linearGradient>

    <!-- Commutateur lumineux TPL : corps (centré) -->
    <g id="c-tpl">
      <circle r="31" filter="url(#flou)" style="fill:var(--rouge);opacity:calc(var(--lit,0) * .8)"/>
      <circle r="40" filter="url(#flou)" style="fill:#fff7d6;opacity:var(--lit-blanc,0)"/>
      <circle r="27" fill="url(#g-chrome)" stroke="#3b3f44" stroke-width="1.2" filter="url(#ombre)"/>
      <circle r="22.5" fill="#2a2d31"/>
      <circle r="21.5" fill="url(#g-dome)"/>
      <circle r="21.5" fill="url(#g-dome-rouge)" style="opacity:var(--lit,0)"/>
      <circle r="21.5" fill="url(#g-dome-blanc)" style="opacity:var(--lit-blanc,0)"/>
      <circle r="21.5" filter="url(#flou)" style="fill:#fffbe8;opacity:calc(var(--lit-blanc,0) * .85)"/>
    </g>
    <radialGradient id="g-dome-blanc" cx=".45" cy=".4" r=".75">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".65" stop-color="#fffdf2"/><stop offset="1" stop-color="#f3e9c4"/>
    </radialGradient>

    <!-- Commutateur lumineux TPL : manette (centrée, repère vers le haut) -->
    <g id="c-manette">
      <rect x="-7.5" y="-24" width="15" height="48" rx="5" fill="url(#g-manette)" stroke="#4a4e54" stroke-width="1.2"/>
      <rect x="-7.5" y="-24" width="15" height="48" rx="5" style="fill:var(--rouge);opacity:calc(var(--lit,0) * .35)"/>
      <rect x="-7.5" y="-24" width="15" height="48" rx="5" style="fill:#fffbe8;opacity:calc(var(--lit-blanc,0) * .45)"/>
      <path d="M0 -20 l4 7 h-8 Z" fill="#2b2f33"/>
    </g>

    <!-- Vis de fixation -->
    <g id="c-vis">
      <circle r="4.2" fill="url(#g-chrome)" stroke="#5a5f66" stroke-width=".8"/>
      <line x1="-2.6" y1="-1.6" x2="2.6" y2="1.6" stroke="#4a4e54" stroke-width="1.1"/>
    </g>

    <!-- Clé (centrée sur l'anneau) -->
    <radialGradient id="g-laiton" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#f6e3a1"/><stop offset=".55" stop-color="#c9a24a"/><stop offset="1" stop-color="#7d6122"/>
    </radialGradient>
    <g id="c-cle">
      <rect x="-6" y="13" width="12" height="34" rx="2" fill="url(#g-chrome)" stroke="#4a4e54" stroke-width="2"/>
      <path d="M6 28 h7 v5 h-7 M6 38 h9 v5 h-9" fill="#c9cdd2" stroke="#4a4e54" stroke-width="2"/>
      <circle r="16" fill="url(#g-chrome)" stroke="#4a4e54" stroke-width="2"/>
      <circle r="10" fill="#f4f4ee" stroke="#4a4e54" stroke-width="1"/>
    </g>
  </defs>

  <!-- ===================================================== -->
  <!--  FONDS                                                -->
  <!-- ===================================================== -->
  <rect width="2000" height="800" fill="#23262a"/>
  <rect x="10" y="10" width="1980" height="530" rx="10" fill="url(#g-ivoire)" stroke="#0f1012" stroke-width="2"/>
  <rect x="10" y="552" width="1980" height="238" rx="10" fill="url(#g-console)" stroke="#0f1012" stroke-width="2"/>
  <rect x="16" y="558" width="1968" height="226" rx="7" fill="none" stroke="#4f6f4f" stroke-width="2" opacity=".6"/>

  <!-- ===================================================== -->
  <!--  BLOCK CÔTÉ ALFA                                      -->
  <!-- ===================================================== -->
  <g id="panneau-alfa">
    <rect x="40" y="40" width="232" height="462" rx="6" fill="url(#g-plaque)" stroke="#6b6f74" stroke-width="1.5" filter="url(#ombre-panneau)"/>
    <use href="#c-vis" x="50" y="50"/><use href="#c-vis" x="262" y="50"/><use href="#c-vis" x="50" y="492"/><use href="#c-vis" x="262" y="492"/>

    <rect x="60" y="62" width="192" height="113" rx="4" fill="var(--plaque)" stroke="#b9bcc0" stroke-width="2"/>
    <text class="lbl-plaque" x="156" y="92">BLOCK</text>
    <text class="lbl-plaque" x="156" y="118">CÔTÉ ALFA</text>
    <line x1="72" y1="131" x2="240" y2="131" stroke="#6b6f74"/>
    <text class="lbl-plaque" x="108" y="158">VOIE 1</text>
    <text class="lbl-plaque" x="204" y="158">VOIE 2</text>

    <rect x="60" y="195" width="192" height="288" rx="4" fill="#ebe7d6" stroke="#55595e" stroke-width="1.5"/>
    <g stroke="#55595e" stroke-width="1.5">
      <line x1="156" y1="195" x2="156" y2="483"/><line x1="60" y1="290" x2="252" y2="290"/><line x1="60" y1="386" x2="252" y2="386"/>
    </g>

    <!-- Repère : Reddition et Sonnerie s'actionnent ensemble pour rendre voie libre -->
    <path class="liaison" d="M77 240 h-8 V338 h8"/>
    <text class="lbl-sm" x="108" y="208">REDDITION</text>
    <g id="A_B_RED" class="btn interactif"><title>A_B_RED — Reddition (côté Alfa)</title><use href="#c-btn" x="108" y="240"/></g>

    <text class="lbl-sm" x="204" y="208">ANNONCE</text>
    <g id="A_B_ANN" class="btn interactif"><title>A_B_ANN — Annonce (côté Alfa)</title><use href="#c-btn" x="204" y="240"/></g>
    <text class="lbl-sm" x="176" y="282">VOIE</text>
    <text class="lbl-sm" x="228" y="282">LIBRE</text>
    <g id="A_V_VL" class="lamp"><title>A_V_VL — Voie libre (côté Alfa)</title><use href="#c-lamp" x="201" y="278"/></g>

    <text class="lbl-sm" x="108" y="304">SONNERIE</text>
    <g id="A_B_SN1" class="btn interactif"><title>A_B_SN1 — Sonnerie (côté Alfa, voie 1)</title><use href="#c-btn" x="108" y="338"/></g>
    <text class="lbl-sm" x="204" y="304">SONNERIE</text>
    <g id="A_B_SN2" class="btn interactif"><title>A_B_SN2 — Sonnerie (côté Alfa, voie 2)</title><use href="#c-btn" x="204" y="338"/></g>

    <text class="lbl-sm" transform="translate(170 398)">
      <tspan x="0" dy="0">S</tspan><tspan x="0" dy="10">É</tspan><tspan x="0" dy="10">M</tspan><tspan x="0" dy="10">A</tspan><tspan x="0" dy="10">P</tspan><tspan x="0" dy="10">H</tspan><tspan x="0" dy="10">O</tspan><tspan x="0" dy="10">R</tspan><tspan x="0" dy="10">E</tspan>
    </text>
    <g id="A_V_S1" class="lamp"><title>A_V_S1 — Voyant sémaphore S1</title><use href="#c-lamp" x="210" y="402"/></g>
    <g id="A_C_S1" class="commut interactif" data-pos="ferme" data-etat="rouge" transform="translate(210 446)"><title>A_C_S1 — Commutateur sémaphore S1</title>
      <use href="#c-tpl"/><g class="manette"><use href="#c-manette"/></g></g>
  </g>

  <!-- ===================================================== -->
  <!--  BLOCK CÔTÉ CHARLIE                                   -->
  <!-- ===================================================== -->
  <g id="panneau-charlie">
    <rect x="1728" y="40" width="232" height="462" rx="6" fill="url(#g-plaque)" stroke="#6b6f74" stroke-width="1.5" filter="url(#ombre-panneau)"/>
    <use href="#c-vis" x="1738" y="50"/><use href="#c-vis" x="1950" y="50"/><use href="#c-vis" x="1738" y="492"/><use href="#c-vis" x="1950" y="492"/>

    <rect x="1748" y="62" width="192" height="113" rx="4" fill="var(--plaque)" stroke="#b9bcc0" stroke-width="2"/>
    <text class="lbl-plaque" x="1844" y="92">BLOCK</text>
    <text class="lbl-plaque" x="1844" y="118">CÔTÉ CHARLIE</text>
    <line x1="1760" y1="131" x2="1928" y2="131" stroke="#6b6f74"/>
    <text class="lbl-plaque" x="1796" y="158">VOIE 2</text>
    <text class="lbl-plaque" x="1892" y="158">VOIE 1</text>

    <rect x="1748" y="195" width="192" height="288" rx="4" fill="#ebe7d6" stroke="#55595e" stroke-width="1.5"/>
    <g stroke="#55595e" stroke-width="1.5">
      <line x1="1844" y1="195" x2="1844" y2="483"/><line x1="1748" y1="290" x2="1940" y2="290"/><line x1="1748" y1="386" x2="1940" y2="386"/>
    </g>

    <path class="liaison" d="M1765 240 h-8 V338 h8"/>
    <text class="lbl-sm" x="1796" y="208">REDDITION</text>
    <g id="C_B_RED" class="btn interactif"><title>C_B_RED — Reddition (côté Charlie)</title><use href="#c-btn" x="1796" y="240"/></g>

    <text class="lbl-sm" x="1892" y="208">ANNONCE</text>
    <g id="C_B_ANN" class="btn interactif"><title>C_B_ANN — Annonce (côté Charlie)</title><use href="#c-btn" x="1892" y="240"/></g>
    <text class="lbl-sm" x="1864" y="282">VOIE</text>
    <text class="lbl-sm" x="1916" y="282">LIBRE</text>
    <g id="C_V_VL" class="lamp"><title>C_V_VL — Voie libre (côté Charlie)</title><use href="#c-lamp" x="1889" y="278"/></g>

    <text class="lbl-sm" x="1796" y="304">SONNERIE</text>
    <g id="C_B_SN2" class="btn interactif"><title>C_B_SN2 — Sonnerie (côté Charlie, voie 2)</title><use href="#c-btn" x="1796" y="338"/></g>
    <text class="lbl-sm" x="1892" y="304">SONNERIE</text>
    <g id="C_B_SN1" class="btn interactif"><title>C_B_SN1 — Sonnerie (côté Charlie, voie 1)</title><use href="#c-btn" x="1892" y="338"/></g>

    <text class="lbl-sm" transform="translate(1858 398)">
      <tspan x="0" dy="0">S</tspan><tspan x="0" dy="10">É</tspan><tspan x="0" dy="10">M</tspan><tspan x="0" dy="10">A</tspan><tspan x="0" dy="10">P</tspan><tspan x="0" dy="10">H</tspan><tspan x="0" dy="10">O</tspan><tspan x="0" dy="10">R</tspan><tspan x="0" dy="10">E</tspan>
    </text>
    <g id="C_V_S2" class="lamp"><title>C_V_S2 — Voyant sémaphore S2</title><use href="#c-lamp" x="1898" y="402"/></g>
    <g id="C_C_S2" class="commut interactif" data-pos="ferme" data-etat="rouge" transform="translate(1898 446)"><title>C_C_S2 — Commutateur sémaphore S2</title>
      <use href="#c-tpl"/><g class="manette"><use href="#c-manette"/></g></g>
  </g>

  <!-- ===================================================== -->
  <!--  TCC                                                  -->
  <!-- ===================================================== -->
  <g id="tcc">
    <rect x="878" y="24" width="260" height="54" rx="5" fill="var(--plaque)" stroke="#b9bcc0" stroke-width="2.5" filter="url(#ombre)"/>
    <text class="lbl-titre" x="1011" y="63">T.C.C</text>

    <!-- Poste B, bâtiment voyageurs et quai V1 (repères géographiques) -->
    <text class="lbl" x="654" y="57">POSTE B</text>
    <rect x="610" y="68" width="90" height="34" rx="2" fill="#fdfcf5" stroke="#3a3e43" stroke-width="2"/>
    <path d="M641 102 V84 H669 V102 M647 94 H663" fill="none" stroke="#3a3e43" stroke-width="2"/>
    <text class="lbl" x="654" y="123">B.V.</text>
    <path d="M622 118 H584 V188 H689 M765 188 H846 V118 H686" fill="none" stroke="var(--voie)" stroke-width="2" stroke-linejoin="round"/>

    <!-- Libellés de voie -->
    <text class="lbl-voie" x="342" y="233">V1</text>
    <text class="lbl-voie" x="342" y="367">V2</text>
    <text class="lbl-voie" x="1658" y="233">V1</text>
    <text class="lbl-voie" x="1658" y="367">V2</text>

    <!-- Flèches grises (voies d'approche / de sortie) -->
    <g fill="var(--voie-grise)">
      <path d="M387 208 H455 V190 L500 217 L455 244 V226 H387 Z"/><rect x="498" y="208" width="65" height="18"/>
      <path d="M563 342 H495 V325 L452 351 L495 377 V360 H563 Z"/><rect x="387" y="342" width="67" height="18"/>
      <path d="M1447 208 H1517 V190 L1562 217 L1517 244 V226 H1447 Z"/><rect x="1560" y="208" width="52" height="18"/>
      <path d="M1612 342 H1565 V325 L1520 351 L1565 377 V360 H1612 Z"/><rect x="1447" y="342" width="75" height="18"/>
    </g>

    <!-- Communication V1/V2 (aiguilles E et F) -->
    <g stroke-width="17">
      <line id="T_AIG_E" class="aig" data-pos="normale" x1="1140" y1="217" x2="1024" y2="279"/>
      <line id="T_AIG_F" class="aig" data-pos="normale" x1="1006" y1="289" x2="882" y2="352"/>
    </g>
    <!-- Voies -->
    <g fill="url(#g-voie)">
      <rect x="583" y="208" width="570" height="18" rx="2"/>
      <rect x="1173" y="208" width="252" height="18" rx="2"/>
      <rect x="583" y="342" width="263" height="18" rx="2"/>
      <rect x="866" y="342" width="559" height="18" rx="2"/>
    </g>
    <circle cx="1103" cy="172" r="23" fill="#fbf9ec" stroke="#e8891c" stroke-width="3"/>
    <text class="lbl-ef" x="1103" y="183">E</text>
    <circle cx="901" cy="400" r="23" fill="#fbf9ec" stroke="#e8891c" stroke-width="3"/>
    <text class="lbl-ef" x="901" y="411">F</text>

    <!-- Zones -->
    <text class="lbl-zone" x="727" y="197">z1</text>
    <g id="T_V_Z1" class="zone" data-zone="Z1"><title>T_V_Z1 — Zone z1</title><use href="#c-zone" x="693" y="206"/></g>
    <g id="T_V_Z1B" class="zone" data-zone="Z1"><title>T_V_Z1B — Zone z1 (2e contrôle)</title><use href="#c-zone" x="980" y="206"/></g>
    <text class="lbl-zone" x="1307" y="197">z3</text>
    <g id="T_V_Z3" class="zone" data-zone="Z3"><title>T_V_Z3 — Zone z3</title><use href="#c-zone" x="1273" y="206"/></g>

    <text class="lbl-zone" x="727" y="331">z4</text>
    <g id="T_V_Z4" class="zone" data-zone="Z4"><title>T_V_Z4 — Zone z4</title><use href="#c-zone" x="693" y="340"/></g>
    <g id="T_V_Z2B" class="zone" data-zone="Z2"><title>T_V_Z2B — Zone z2 (2e contrôle)</title><use href="#c-zone" x="980" y="340"/></g>
    <text class="lbl-zone" x="1307" y="331">z2</text>
    <g id="T_V_Z2" class="zone" data-zone="Z2"><title>T_V_Z2 — Zone z2</title><use href="#c-zone" x="1273" y="340"/></g>

    <!-- Quai V2 (repère géographique, rien ne s'y affiche) -->
    <rect x="584" y="387" width="262" height="70" rx="2" fill="none" stroke="var(--voie)" stroke-width="2"/>

    <!-- Aiguilles E et F : serrures à pêne saillant (clés du point E) et leviers de manœuvre -->
    <g id="aiguilles">
      <rect x="966" y="398" width="448" height="130" rx="8" fill="#e9e4cc" stroke="#8a8d92" stroke-width="1.5"/>
