<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMDV — TCO Poste B</title>
<link rel="stylesheet" href="css/tco.css">
</head>
<body>

<!--
  TCO du poste B (Bravo).
  Chaque élément manipulable porte un id conforme à la nomenclature :
    préfixe  A_  block côté Alfa      C_  block côté Charlie
             T_  TCC                  E_  Point E
    type     B_  bouton   V_  voyant   C_  commutateur
  L'état visuel se pilote par l'attribut data-etat (blanc, jaune, rouge, bleu, vert)
  ou data-pos pour les commutateurs (ferme / ouvert, I / A).
  Les zones portent aussi data-zone : z1 et z2 ont chacune deux contrôles (T_V_Z1 + T_V_Z1B, T_V_Z2 + T_V_Z2B).
-->

<svg class="tco" viewBox="0 0 2000 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ombre" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity=".45"/>
    </filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="flou"/>
      <feMerge><feMergeNode in="flou"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ombre-panneau" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="5" stdDeviation="4" flood-opacity=".3"/>
    </filter>

    <!-- Clé (point E) -->
    <symbol id="cle" viewBox="-20 -20 40 70" overflow="visible">
      <circle cx="0" cy="0" r="16" fill="#cfd3d8" stroke="#555" stroke-width="2.5"/>
      <rect x="-6" y="13" width="12" height="34" rx="2" fill="#cfd3d8" stroke="#555" stroke-width="2.5"/>
      <path d="M6 28 h7 v5 h-7 M6 38 h9 v5 h-9" fill="#cfd3d8" stroke="#555" stroke-width="2.5"/>
    </symbol>
  </defs>

  <!-- ===================================================== -->
  <!--  FONDS                                                -->
  <!-- ===================================================== -->
  <rect x="0" y="0" width="2000" height="545" fill="var(--fond-tcc)" stroke="var(--cadre)" stroke-width="8"/>
  <rect x="0" y="545" width="2000" height="255" fill="var(--cadre-console)"/>
  <rect x="22" y="562" width="1956" height="214" fill="var(--fond-console)" stroke="#3f5f3f" stroke-width="6"/>

  <!-- ===================================================== -->
  <!--  BLOCK CÔTÉ ALFA                                      -->
  <!-- ===================================================== -->
  <g id="panneau-alfa">
    <rect x="40" y="40" width="232" height="462" fill="#f6f3ea" stroke="#555" stroke-width="2" filter="url(#ombre-panneau)"/>
    <rect x="60" y="60" width="192" height="115" fill="#fff" stroke="#333" stroke-width="2"/>
    <text class="lbl-titre" x="156" y="92">BLOCK</text>
    <text class="lbl-titre" x="156" y="121">COTE ALFA</text>
    <text class="lbl-titre" x="108" y="153">VOIE 1</text>
    <text class="lbl-titre" x="204" y="153">VOIE 2</text>

    <rect x="60" y="195" width="192" height="288" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="156" y1="195" x2="156" y2="483" stroke="#333" stroke-width="2"/>
    <line x1="60" y1="290" x2="252" y2="290" stroke="#333" stroke-width="2"/>
    <line x1="60" y1="386" x2="252" y2="386" stroke="#333" stroke-width="2"/>

    <text class="lbl-sm" x="108" y="210">REDDITION</text>
    <g id="A_B_RED" class="btn interactif"><title>A_B_RED — Reddition (côté Alfa)</title>
      <rect class="face" x="84" y="218" width="48" height="48"/></g>

    <text class="lbl-sm" x="204" y="210">ANNONCE</text>
    <g id="A_B_ANN" class="btn interactif"><title>A_B_ANN — Annonce (côté Alfa)</title>
      <rect class="face" x="180" y="218" width="48" height="48"/></g>
    <text class="lbl-sm" x="176" y="281">VOIE</text>
    <text class="lbl-sm" x="227" y="281">LIBRE</text>
    <g id="A_V_VL" class="lamp"><title>A_V_VL — Voie libre (côté Alfa)</title>
      <circle class="verre" cx="201" cy="277" r="7"/></g>

    <text class="lbl-sm" x="108" y="306">SONNERIE</text>
    <g id="A_B_SN1" class="btn interactif"><title>A_B_SN1 — Sonnerie (côté Alfa, voie 1)</title>
      <rect class="face" x="84" y="314" width="48" height="48"/></g>
    <text class="lbl-sm" x="204" y="306">SONNERIE</text>
    <g id="A_B_SN2" class="btn interactif"><title>A_B_SN2 — Sonnerie (côté Alfa, voie 2)</title>
      <rect class="face" x="180" y="314" width="48" height="48"/></g>

    <text class="lbl-sm" x="0" y="0" transform="translate(167 396)">
      <tspan x="0" dy="0">S</tspan><tspan x="0" dy="10">E</tspan><tspan x="0" dy="10">M</tspan><tspan x="0" dy="10">A</tspan><tspan x="0" dy="10">P</tspan><tspan x="0" dy="10">H</tspan><tspan x="0" dy="10">O</tspan><tspan x="0" dy="10">R</tspan><tspan x="0" dy="10">E</tspan>
    </text>
    <g id="A_V_S1" class="lamp"><title>A_V_S1 — Voyant sémaphore S1</title>
      <circle class="verre" cx="210" cy="405" r="7"/></g>
    <g id="A_C_S1" class="commut interactif" data-pos="ferme"><title>A_C_S1 — Commutateur sémaphore S1</title>
      <circle cx="210" cy="446" r="26" fill="#d9dde3" stroke="#555" stroke-width="3"/>
      <g class="barre" style="transform-origin:210px 446px"><rect x="203" y="423" width="14" height="46" rx="3" fill="#fff" stroke="#555" stroke-width="2.5"/><rect x="207" y="427" width="6" height="10" rx="1" fill="#333"/></g>
    </g>
  </g>

  <!-- ===================================================== -->
  <!--  BLOCK CÔTÉ CHARLIE                                   -->
  <!-- ===================================================== -->
  <g id="panneau-charlie">
    <rect x="1728" y="40" width="232" height="458" fill="#f6f3ea" stroke="#555" stroke-width="2" filter="url(#ombre-panneau)"/>
    <rect x="1748" y="60" width="192" height="110" fill="#fff" stroke="#333" stroke-width="2"/>
    <text class="lbl-titre" x="1844" y="105">COTE CHARLIE</text>
    <text class="lbl-titre" x="1796" y="147">VOIE 2</text>
    <text class="lbl-titre" x="1892" y="147">VOIE 1</text>

    <rect x="1748" y="188" width="192" height="290" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="1844" y1="188" x2="1844" y2="478" stroke="#333" stroke-width="2"/>
    <line x1="1748" y1="284" x2="1940" y2="284" stroke="#333" stroke-width="2"/>
    <line x1="1748" y1="380" x2="1940" y2="380" stroke="#333" stroke-width="2"/>

    <text class="lbl-sm" x="1796" y="204">REDDITION</text>
    <g id="C_B_RED" class="btn interactif"><title>C_B_RED — Reddition (côté Charlie)</title>
      <rect class="face" x="1772" y="212" width="48" height="48"/></g>

    <text class="lbl-sm" x="1892" y="204">ANNONCE</text>
    <g id="C_B_ANN" class="btn interactif"><title>C_B_ANN — Annonce (côté Charlie)</title>
      <rect class="face" x="1868" y="212" width="48" height="48"/></g>
    <text class="lbl-sm" x="1864" y="275">VOIE</text>
    <text class="lbl-sm" x="1915" y="275">LIBRE</text>
    <g id="C_V_VL" class="lamp"><title>C_V_VL — Voie libre (côté Charlie)</title>
      <circle class="verre" cx="1889" cy="271" r="7"/></g>

    <text class="lbl-sm" x="1796" y="300">SONNERIE</text>
    <g id="C_B_SN2" class="btn interactif"><title>C_B_SN2 — Sonnerie (côté Charlie, voie 2)</title>
      <rect class="face" x="1772" y="308" width="48" height="48"/></g>
    <text class="lbl-sm" x="1892" y="300">SONNERIE</text>
    <g id="C_B_SN1" class="btn interactif"><title>C_B_SN1 — Sonnerie (côté Charlie, voie 1)</title>
      <rect class="face" x="1868" y="308" width="48" height="48"/></g>

    <text class="lbl-sm" x="0" y="0" transform="translate(1855 390)">
      <tspan x="0" dy="0">S</tspan><tspan x="0" dy="10">E</tspan><tspan x="0" dy="10">M</tspan><tspan x="0" dy="10">A</tspan><tspan x="0" dy="10">P</tspan><tspan x="0" dy="10">H</tspan><tspan x="0" dy="10">O</tspan><tspan x="0" dy="10">R</tspan><tspan x="0" dy="10">E</tspan>
    </text>
    <g id="C_V_S2" class="lamp"><title>C_V_S2 — Voyant sémaphore S2</title>
      <circle class="verre" cx="1898" cy="399" r="7"/></g>
    <g id="C_C_S2" class="commut interactif" data-pos="ferme"><title>C_C_S2 — Commutateur sémaphore S2</title>
      <circle cx="1898" cy="440" r="26" fill="#d9dde3" stroke="#555" stroke-width="3"/>
      <g class="barre" style="transform-origin:1898px 440px"><rect x="1891" y="417" width="14" height="46" rx="3" fill="#fff" stroke="#555" stroke-width="2.5"/><rect x="1895" y="421" width="6" height="10" rx="1" fill="#333"/></g>
    </g>
  </g>

  <!-- ===================================================== -->
  <!--  TCC (tableau de contrôle optique de la zone B)       -->
  <!-- ===================================================== -->
  <g id="tcc">
    <rect x="866" y="22" width="284" height="58" fill="#fff" stroke="#555" stroke-width="3"/>
    <rect x="871" y="27" width="274" height="48" fill="none" stroke="#999" stroke-width="1"/>
    <text class="lbl-serif" x="1008" y="66">T.C.C</text>

    <!-- Poste B, bâtiment voyageurs et quai V1 (repères géographiques) -->
    <text class="lbl" x="654" y="57">POSTE B</text>
    <rect x="610" y="68" width="90" height="34" fill="#fff" stroke="#333" stroke-width="2"/>
    <path d="M641 102 V84 H669 V102 M647 94 H663" fill="none" stroke="#333" stroke-width="2"/>
    <text class="lbl" x="654" y="123">B.V.</text>
    <path d="M622 118 H584 V188 H693 M770 188 H846 V118 H686" fill="none" stroke="var(--voie)" stroke-width="2"/>

    <!-- Libellés de voie -->
    <text class="lbl-voie" x="342" y="229">V1</text>
    <text class="lbl-voie" x="342" y="366">V2</text>
    <text class="lbl-voie" x="1650" y="227">V1</text>
    <text class="lbl-voie" x="1650" y="366">V2</text>

    <!-- Flèches grises (voies d'approche / de sortie) -->
    <g fill="var(--voie-grise)">
      <path d="M387 208 H455 V190 L500 217 L455 244 V226 H387 Z"/><rect x="498" y="208" width="65" height="18"/>
      <path d="M563 342 H495 V325 L452 351 L495 377 V360 H563 Z"/><rect x="387" y="342" width="67" height="18"/>
      <path d="M1447 208 H1517 V190 L1562 217 L1517 244 V226 H1447 Z"/><rect x="1560" y="208" width="52" height="18"/>
      <path d="M1612 342 H1565 V325 L1520 351 L1565 377 V360 H1612 Z"/><rect x="1447" y="342" width="75" height="18"/>
    </g>

    <!-- Voies orange -->
    <g fill="var(--voie)">
      <rect x="583" y="208" width="570" height="18"/>
      <rect x="1173" y="208" width="252" height="18"/>
      <rect x="583" y="342" width="263" height="18"/>
      <rect x="866" y="342" width="559" height="18"/>
    </g>
    <!-- Communication V1/V2 (aiguilles E et F) -->
    <g stroke="var(--voie)" stroke-width="17">
      <line x1="1140" y1="217" x2="1024" y2="279"/>
      <line x1="1006" y1="289" x2="882" y2="352"/>
    </g>
    <circle cx="1103" cy="175" r="25" fill="var(--fond-tcc)" stroke="#f39a2e" stroke-width="3"/>
    <text class="lbl-ef" x="1103" y="187">E</text>
    <circle cx="901" cy="397" r="25" fill="var(--fond-tcc)" stroke="#f39a2e" stroke-width="3"/>
    <text class="lbl-ef" x="901" y="409">F</text>

    <!-- Zones -->
    <text class="lbl-zone" x="728" y="200">z1</text>
    <g id="T_V_Z1" class="zone" data-zone="Z1"><title>T_V_Z1 — Zone z1</title><rect x="693" y="206" width="68" height="22"/></g>
    <g id="T_V_Z1B" class="zone" data-zone="Z1"><title>T_V_Z1B — Zone z1 (2e contrôle)</title><rect x="980" y="206" width="68" height="22"/></g>
    <text class="lbl-zone" x="1308" y="200">z3</text>
    <g id="T_V_Z3" class="zone" data-zone="Z3"><title>T_V_Z3 — Zone z3</title><rect x="1273" y="206" width="68" height="22"/></g>

    <text class="lbl-zone" x="728" y="334">z4</text>
    <g id="T_V_Z4" class="zone" data-zone="Z4"><title>T_V_Z4 — Zone z4</title><rect x="693" y="340" width="68" height="22"/></g>
    <g id="T_V_Z2B" class="zone" data-zone="Z2"><title>T_V_Z2B — Zone z2 (2e contrôle)</title><rect x="980" y="340" width="68" height="22"/></g>
    <text class="lbl-zone" x="1305" y="334">z2</text>
    <g id="T_V_Z2" class="zone" data-zone="Z2"><title>T_V_Z2 — Zone z2</title><rect x="1273" y="340" width="68" height="22"/></g>

    <!-- Quai V2 (repère géographique, rien ne s'y affiche) -->
    <rect x="584" y="387" width="262" height="70" fill="none" stroke="var(--voie)" stroke-width="2"/>

    <!-- Annonce V1 + carré C1 -->
    <text class="lbl-md" x="410" y="153">Annonce</text>
    <g id="T_V_AN1" class="lamp"><title>T_V_AN1 — Voyant d'annonce V1</title>
      <circle class="verre" cx="408" cy="170" r="7"/></g>
    <text class="lbl-md" x="544" y="171">C1</text>
    <path d="M528 193 H520 V208" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="528" y="182" width="33" height="21" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <g id="T_V_C1" class="lamp"><title>T_V_C1 — Carré C1</title>
      <circle class="verre" cx="545" cy="192.5" r="6"/></g>

    <!-- Annonce V2 + carré C2 -->
    <text class="lbl-md" x="1597" y="430">Annonce</text>
    <g id="T_V_AN2" class="lamp"><title>T_V_AN2 — Voyant d'annonce V2</title>
      <circle class="verre" cx="1597" cy="400" r="7"/></g>
    <text class="lbl-md" x="1462" y="413">C2</text>
    <path d="M1479 377 H1488 V360" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="1446" y="367" width="33" height="21" rx="3" fill="#fff" stroke="#333" stroke-width="2"/>
    <g id="T_V_C2" class="lamp"><title>T_V_C2 — Carré C2</title>
      <circle class="verre" cx="1462" cy="377.5" r="6"/></g>

    <!-- Autorisation au point E -->
    <text class="lbl-md" x="1165" y="153">Au E</text>
    <g id="T_V_AUE" class="lamp"><title>T_V_AUE — Voyant Au E</title>
      <circle class="verre" cx="1163" cy="174" r="7"/></g>
    <text class="lbl-md" x="1228" y="116">I</text>
    <text class="lbl-md" x="1228" y="196">A</text>
    <g id="T_C_AUE" class="commut interactif" data-pos="A"><title>T_C_AUE — Commutateur Au E (A / I)</title>
      <circle cx="1228" cy="150" r="26" fill="#d9dde3" stroke="#555" stroke-width="3"/>
      <g class="barre" style="transform-origin:1228px 150px"><rect x="1221" y="127" width="14" height="46" rx="3" fill="#fff" stroke="#555" stroke-width="2.5"/><rect x="1225" y="131" width="6" height="10" rx="1" fill="#333"/></g>
    </g>
  </g>

  <!-- ===================================================== -->
  <!--  CONSOLE                                              -->
  <!-- ===================================================== -->


  <!-- SAAT -->
  <g id="saat">
    <path d="M336 596 q-12 0 -12 12 v52 q0 8 -10 10 q10 2 10 10 v52 q0 12 12 12" fill="none" stroke="var(--saat)" stroke-width="2"/>
    <path d="M808 596 q12 0 12 12 v52 q0 8 10 10 q-10 2 -10 10 v52 q0 12 -12 12" fill="none" stroke="var(--saat)" stroke-width="2"/>
    <line x1="346" y1="628" x2="798" y2="628" stroke="var(--saat)" stroke-width="2"/>
    <line x1="346" y1="704" x2="798" y2="704" stroke="var(--saat)" stroke-width="2"/>
    <text class="lbl-saat" x="396" y="603">An</text>
    <g id="SAAT_AN1" class="saat"><title>SAAT_AN1 — Annonce V1</title><rect x="392" y="608" width="100" height="40"/><text class="lbl-saat-v" x="442" y="633"></text></g>
    <text class="lbl-saat" x="662" y="603">C1</text>
    <g id="SAAT_C1" class="saat"><title>SAAT_C1 — Carré C1</title><rect x="658" y="608" width="100" height="40"/><text class="lbl-saat-v" x="708" y="633"></text></g>
    <text class="lbl-saat" x="396" y="679">C2</text>
    <g id="SAAT_C2" class="saat"><title>SAAT_C2 — Carré C2</title><rect x="392" y="684" width="100" height="40"/><text class="lbl-saat-v" x="442" y="709"></text></g>
    <text class="lbl-saat" x="662" y="679">An</text>
    <g id="SAAT_AN2" class="saat"><title>SAAT_AN2 — Annonce V2</title><rect x="658" y="684" width="100" height="40"/><text class="lbl-saat-v" x="708" y="709"></text></g>
    <text class="lbl-md" x="872" y="676">SAAT</text>
  </g>

  <!-- Titre console + bulletins -->
  <rect x="903" y="580" width="226" height="57" fill="#eef4ec" stroke="#555" stroke-width="3"/>
  <rect x="908" y="585" width="216" height="47" fill="none" stroke="#999" stroke-width="1"/>
  <text class="lbl-serif" x="1016" y="624" style="font-size:40px">Console</text>

  <g id="BUL_C" class="bulletin interactif"><title>BUL_C — Bulletin C</title>
    <path d="M956 697 h26 l12 12 v36 h-38 Z M982 697 v12 h12" filter="url(#ombre)"/><text class="lbl-md" x="975" y="732">C</text></g>
  <g id="BUL_S" class="bulletin interactif"><title>BUL_S — Bulletin S</title>
    <path d="M1003 697 h26 l12 12 v36 h-38 Z M1029 697 v12 h12" filter="url(#ombre)"/><text class="lbl-md" x="1022" y="732">S</text></g>
  <g id="BUL_MV" class="bulletin interactif"><title>BUL_MV — Bulletin MV</title>
    <path d="M1050 697 h26 l12 12 v36 h-38 Z M1076 697 v12 h12" filter="url(#ombre)"/><text class="lbl-md" x="1069" y="732">MV</text></g>

  <!-- Point E -->
  <g id="point-e">
    <text class="lbl-md" x="1100" y="676">Point E</text>
    <path d="M1172 596 q-12 0 -12 12 v52 q0 8 -10 10 q10 2 10 10 v52 q0 12 12 12" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M1690 596 q12 0 12 12 v52 q0 8 10 10 q-10 2 -10 10 v52 q0 12 -12 12" fill="none" stroke="#333" stroke-width="2"/>

    <g id="E_V_ZAP1" class="tile"><title>E_V_ZAP1 — ZAP C1</title><rect class="face" x="1186" y="577" width="46" height="66"/><rect x="1186" y="627" width="46" height="16" fill="#fff" stroke="#222"/><text class="lbl-tile" x="1209" y="639">ZAP C1</text></g>
    <g id="E_V_EAP1" class="tile"><title>E_V_EAP1 — EAP C1</title><rect class="face" x="1241" y="577" width="46" height="66"/><rect x="1241" y="627" width="46" height="16" fill="#fff" stroke="#222"/><text class="lbl-tile" x="1264" y="639">EAP C1</text></g>
    <g id="E_V_C1" class="tile"><title>E_V_C1 — K C1</title><rect class="face" x="1295" y="577" width="46" height="66"/><rect x="1295" y="627" width="46" height="16" fill="#fff" stroke="#222"/><text class="lbl-tile" x="1318" y="639">K C1</text></g>
    <g id="E_V_Z1" class="tile"><title>E_V_Z1 — Z1</title><rect class="face" x="1350" y="577" width="46" height="66"/><rect x="1350" y="627" width="46" height="16" fill="#fff" stroke="#222"/><text class="lbl-tile" x="1373" y="639">Z1</text></g>

    <g id="E_V_Z2" class="tile"><title>E_V_Z2 — Z2</title><rect class="face" x="1463" y="577" width="46" height="66"/><rect x="1463" y="627" width="46" height="16" fill="#fff" stroke="#222"/><text class="lbl-tile" x="1486" y="639">Z2</text></g>
    <g id="E_V_C2" class="tile"><title>E_V_C2 — K C2</title><rect class="face" x="1518" y="577" width="46" height="66"/><rect x="1518" y="627" width="46" height="16" fill="#fff" stroke="#222"/><text class="lbl-tile" x="1541" y="639">K C2</text></g>
    <g id="E_V_EAP2" class="tile"><title>E_V_EAP2 — EAP C2</title><rect class="face" x="1573" y="577" width="46" height="66"/><rect x="1573" y="627" width="46" height="16" fill="#fff" stroke="#222"/><text class="lbl-tile" x="1596" y="639">EAP C2</text></g>
    <g id="E_V_ZAP2" class="tile"><title>E_V_ZAP2 — ZAP C2</title><rect class="face" x="1628" y="577" width="46" height="66"/><rect x="1628" y="627" width="46" height="16" fill="#fff" stroke="#222"/><text class="lbl-tile" x="1651" y="639">ZAP C2</text></g>

    <!-- Chaîne clé E — Vcm1 — Au E — Vcm2 — clé F -->
    <g stroke="#333" stroke-width="2" stroke-dasharray="2 4" fill="none">
      <line x1="1290" y1="693" x2="1262" y2="693"/>
